name: iOS build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build (simulator, unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project NutriSnap.xcodeproj -scheme NutriSnap -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          grep -E "^/.*error:" build.log | sort -u | head -60 | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1 | sed "s|$PWD/||"); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f5-)
            echo "::error file=ios/$f,line=$n::$m"
          done
          grep -q "BUILD SUCCEEDED" build.log
