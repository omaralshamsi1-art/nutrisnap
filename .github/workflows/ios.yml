name: iOS build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build (simulator, unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project NutriSnap.xcodeproj -scheme NutriSnap -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          ERRS=$(grep -E "error:|\*\* BUILD|xcodebuild: error" build.log | sed "s|$PWD/||" | sort -u | head -80 | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::${ERRS:-no error lines}"
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log
