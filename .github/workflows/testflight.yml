name: TestFlight
# Builds a signed release of the iOS app on a GitHub macOS runner and uploads it to App Store Connect.
# Run it from GitHub → Actions → TestFlight → Run workflow.
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   — 10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID      — App Store Connect API key ID
#   ASC_ISSUER_ID   — App Store Connect API issuer ID
#   ASC_KEY_P8      — full text of the downloaded AuthKey_XXXX.p8 file
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISS" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error title=secrets::Missing repository secrets:$missing"; exit 1; fi

      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen

      - name: Install API key
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KID.p8" >> "$GITHUB_ENV"

      - name: Archive (automatic signing with the API key)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios
          set -o pipefail
          BUILD=$((100 + ${{ github.run_number }}))
          xcodebuild -project NutriSnap.xcodeproj -scheme NutriSnap -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NutriSnap.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" > archive.log 2>&1 || {
              ERRS=$(grep -E "error:|\*\* ARCHIVE" archive.log | sort -u | head -40 | awk '{printf "%s%%0A", $0}')
              echo "::error title=archive::${ERRS:-archive failed}"; tail -40 archive.log; exit 1; }
          echo "Archived build $BUILD"

      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NutriSnap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" > export.log 2>&1 || {
              ERRS=$(grep -iE "error|failed|ITMS" export.log | sort -u | head -40 | awk '{printf "%s%%0A", $0}')
              echo "::error title=upload::${ERRS:-upload failed}"; tail -40 export.log; exit 1; }
          grep -iE "upload|succeeded|EXPORT" export.log | tail -5
          echo "::notice title=TestFlight::Uploaded. Apple processes the build for ~10–30 minutes, then it appears in TestFlight."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
